name: Build chemistry revision pack
on:
  push:
    paths:
      - 'chemistry/data.json'
      - 'chemistry/exam.json'
      - 'chemistry/build_pack.py'
      - '.github/workflows/chemistry-pack.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chemistry-pack
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free build dependencies
        run: |
          python -m pip install reportlab Pillow PyMuPDF edge-tts playwright
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m playwright install --with-deps chromium
      - name: Validate the study game
        run: |
          python - <<'PY'
          import json, pathlib
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={"width":1280,"height":900})
              errors=[]
              page.on("pageerror",lambda e:errors.append(str(e)))
              page.goto(pathlib.Path("chemistry/index.html").resolve().as_uri())
              page.get_by_role("button",name="Learn first",exact=True).click()
              page.get_by_role("button",name="Cover / reveal notes").click()
              assert not page.locator("#explain").is_visible()
              page.get_by_role("button",name="Cover / reveal notes").click()
              page.get_by_role("button",name="Practice",exact=True).click()
              page.locator(".answer[data-original='1']").click()
              assert page.locator(".bad").count()==1
              assert page.locator(".good").count()==1
              page.get_by_role("button",name="Retry mistakes",exact=True).click()
              page.locator(".answer[data-original='0']").click()
              assert page.locator(".good").count()==1
              page.get_by_role("button",name="Watch lesson",exact=True).click()
              assert page.locator("#board").is_visible()
              page.screenshot(path="chemistry/game-preview.png",full_page=True)
              page.set_viewport_size({"width":390,"height":844})
              page.get_by_role("button",name="Home",exact=True).click()
              assert page.evaluate("document.documentElement.scrollWidth <= innerWidth")
              assert not errors,errors
              browser.close()
          print("Game interaction and mobile layout checks passed.")
          PY
      - name: Generate and validate PDF and narrated MP4
        run: python chemistry/build_pack.py
      - name: Save completed deliverables
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in Chemistry_Exam_and_Revision.pdf Chemistry_Revision.mp4 pdf-preview.png game-preview.png build-status.json; do
            if test -f "chemistry/$f"; then git add "chemistry/$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated chemistry PDF, video and validation previews"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chemistry-Revision-Pack
          path: |
            chemistry/*.pdf
            chemistry/*.mp4
            chemistry/*preview.png
            chemistry/build-status.json
          if-no-files-found: warn
